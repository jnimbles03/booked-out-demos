<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Booked Out · Demo Studio</title>
<style>
:root{
  --bg:#0b0c10; --panel:#15171e; --panel2:#1c1f29; --line:#2a2e3d;
  --ink:#f2f3f7; --dim:#9aa0b4; --hot:#ff5d73; --gold:#f5c451; --mint:#4ade80; --blue:#5b9dff;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;
  overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.2px}
header .sub{font-size:12px;color:var(--dim)}
.pill{margin-left:auto;font-size:11px;color:var(--dim);border:1px solid var(--line);
  border-radius:99px;padding:4px 10px;white-space:nowrap}
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;padding:8px 16px 120px;
  display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}

/* ============ SHELF: horizontal clip rail ============ */
.rail-label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin:14px 2px 8px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 14px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 210px;scroll-snap-align:start;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px;position:relative;cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .thumb{height:110px;border-radius:12px;background:
  linear-gradient(135deg,var(--panel2),#232838);display:flex;align-items:center;justify-content:center;
  font-size:34px;margin-bottom:10px;overflow:hidden;position:relative}
.card .thumb img{width:100%;height:100%;object-fit:cover}
.card h3{margin:0 0 3px;font-size:14px;line-height:1.25}
.card .city{font-size:12px;color:var(--dim)}
.badge{position:absolute;top:10px;right:10px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.badge.done{background:rgba(74,222,128,.15);color:var(--mint);border:1px solid rgba(74,222,128,.4)}
.badge.pins{background:rgba(245,196,81,.12);color:var(--gold);border:1px solid rgba(245,196,81,.35)}
.badge.new{background:rgba(91,157,255,.12);color:var(--blue);border:1px solid rgba(91,157,255,.35)}
.progress{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--hot),var(--gold));border-radius:99px}

/* new-shop card */
.card.add{border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:190px}
.card.add .plus{font-size:40px;color:var(--dim);font-weight:200}

/* ============ TIMELINE (shop detail) ============ */
.tl{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.step .head{display:flex;align-items:center;gap:10px}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--dim);flex:0 0 auto}
.step.ok .num{background:rgba(74,222,128,.15);border-color:rgba(74,222,128,.5);color:var(--mint)}
.step h4{margin:0;font-size:14px;flex:1}
.step .st{font-size:11px;color:var(--dim)}
.pinlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.pin{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px}
.pin .q{color:var(--ink)}
.pin .q::before{content:"“";color:var(--hot)}
.pin .q::after{content:"”";color:var(--hot)}
.pin .lbl{display:inline-block;font-size:10px;font-weight:700;color:var(--gold);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.pin .src{font-size:11px;color:var(--dim);margin-top:4px}
textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;
  color:var(--ink);font-size:15px;padding:12px;font-family:inherit;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--blue)}
.btn{display:block;width:100%;margin-top:14px;padding:15px;border-radius:14px;border:0;
  font-size:15px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,var(--hot),#ff8a5d);color:#fff}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.back{background:none;border:0;color:var(--dim);font-size:14px;padding:6px 2px;cursor:pointer}
.angle{font-size:13px;color:var(--dim);line-height:1.5;margin-top:8px}
.status-line{font-size:13px;margin-top:10px;color:var(--mint);word-break:break-all}
.status-line.err{color:var(--hot)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--hot);
  border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:8px;margin:10px 0 4px}
.tab{flex:1;text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);color:var(--dim);cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--hot);background:rgba(255,93,115,.08)}
footer{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:rgba(11,12,16,.92);backdrop-filter:blur(10px);font-size:12px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Demo Studio</h1><span class="sub">Booked Out</span>
  <span class="pill" id="count"></span>
</header>
<main>
  <section class="view on" id="v-shelf">
    <div class="rail-label">Glen Ellyn · Hinsdale · Naperville · Downers Grove</div>
    <div class="rail" id="rail-ready"></div>
    <div class="rail-label">Needs 5 pins — record their words first</div>
    <div class="rail" id="rail-todo"></div>
  </section>
  <section class="view" id="v-shop"></section>
</main>
<footer>tap a shop → see its story → <b>Build demo</b> when you're standing at the door</footer>
<script>
const API="https://booqt.com";
let DATA=null, cur=null;
const $=s=>document.querySelector(s);
const emoji=v=>({hair:"💇‍♀️",lash:"👁",brow:"✨",massage:"💆‍♀️",spa:"🧖‍♀️",barber:"💈",wax:"🌙",esthetic:"🌸"}[v]||"📍");

async function boot(){
  const r=await fetch("studio.json?t="+Date.now());
  DATA=(await r.json()).prospects;
  $("#count").textContent=DATA.filter(p=>p.demo).length+" demos ready";
  render();
}
function render(){
  const ready=DATA.filter(p=>p.demo), todo=DATA.filter(p=>!p.demo);
  $("#rail-ready").innerHTML=ready.map(cardHTML).join("")||"<div class='angle'>nothing published yet</div>";
  $("#rail-todo").innerHTML=todo.map(cardHTML).join("")+addCardHTML();
  document.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>openShop(+el.dataset.i));
  $("#addbtn").onclick=()=>openNew();
}
function cardHTML(p,i){
  const idx=DATA.indexOf(p);
  const badge=p.demo?"<span class='badge done'>DEMO LIVE</span>"
    :p.pins.length?"<span class='badge pins'>"+p.pins.length+"/5 PINS</span>"
    :"<span class='badge new'>NEW</span>";
  const pct=Math.round(p.pins.length/5*100);
  return `<div class="card" data-i="${idx}"><div class="thumb">${emoji(p.vertical)}</div>${badge}
    <h3>${p.business}</h3><div class="city">${p.city}${p.handle?" · @"+p.handle:""}</div>
    <div class="progress"><i style="width:${p.demo?100:pct}%"></i></div></div>`;
}
function addCardHTML(){return `<div class="card add" id="addbtn"><div class="plus">+</div></div>`;}

function openShop(i){
  cur=DATA[i];
  $("#v-shop").innerHTML=shopHTML(cur);
  show("v-shop");
  $("#back").onclick=()=>show("v-shelf");
  if(cur.demo){
    $("#watch").onclick=()=>location.href="tour.html?p="+encodeURIComponent(cur.handle||"");
    $("#watchold").onclick=()=>location.href=cur.demo;
  }
  if(cur.handle)$("#build").onclick=()=>build(cur.handle,$("#notes").value);
  const seqBtn=$("#seq");
  if(seqBtn)seqBtn.onclick=()=>location.href="tour.html?edit=1&biz="+encodeURIComponent(cur.business||"");
  poll();
}
function shopHTML(p){
  const pins=p.pins.map(q=>`<div class="pin">${q.label?`<span class="lbl">${q.label}</span><br>`:""}<span class="q">${esc(q.quote)}</span><div class="src">${esc(q.src||"")}</div></div>`).join("");
  return `<button class="back" id="back">← all shops</button>
  <div class="tl">
    <div class="step ${p.pins.length>=5?'ok':''}"><div class="head"><span class="num">1</span>
      <h4>${esc(p.business)} · ${p.city}</h4><span class="st">${p.handle?"@"+p.handle:"no IG yet"}</span></div>
      ${p.angle?`<div class="angle">${esc(p.angle)}</div>`:""}
      ${p.why?`<div class="angle">${esc(p.why)}</div>`:""}
      ${p.contact?`<div class="angle">📞 ${esc(p.contact)}</div>`:""}</div>
    <div class="step ${p.pins.length>=5?'ok':''}"><div class="head"><span class="num">2</span>
      <h4>Their words — ${p.pins.length}/5 pins</h4></div>
      <div class="pinlist">${pins||"<div class='angle'>no pins recorded yet — lift 5 quotes from their IG/posts at the shop</div>"}</div></div>
    <div class="step"><div class="head"><span class="num">3</span><h4>Build</h4>
      <span class="st" id="st3">${p.demo?"live":"ready to fire"}</span></div>
      ${p.demo?`<button class="btn" id="watch">▶ Watch the live tour (real UI)</button>
        <button class="btn ghost" id="watchold">Story demo (quotes first)</button>`:
        `<textarea id="notes" rows="2" placeholder="anything Steve noticed at the door (optional)"></textarea>
         <button class="btn" id="build" ${p.pins.length?"":"disabled"}>🔥 Build demo page</button>
         ${p.pins.length?"":`<button class="btn ghost" id="seq">No Instagram? Sequence the screens on-site →</button>`}
         <div class="status-line" id="stat"></div>`}
    </div>
  </div>`;
}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function show(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$("#"+id).classList.add("on");}

async function build(handle,notes){
  const st=$("#stat"); $("#build").disabled=true;
  st.className="status-line"; st.innerHTML="<span class='spin'></span>enqueuing…";
  try{
    const r=await fetch(API+"/api/demo-requests",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({handle,notes:notes||undefined,source:"demo-studio"})});
    if(!r.ok)throw new Error("api "+r.status);
    st.innerHTML="<span class='spin'></span>queued — building @"+handle+" (~15 min)";
    poll(true);
  }catch(e){
    // CORS/deploy not live yet → clipboard fallback
    navigator.clipboard&&navigator.clipboard.writeText(handle);
    st.className="status-line err";
    st.textContent="API blocked ("+e.message+"). Handle copied — text it to Patrick or use booqt.com/intake.html";
    $("#build").disabled=false;
  }
}
async function poll(force){
  if(!cur||!cur.handle)return;
  if(cur.demo&&!force)return;
  try{
    const r=await fetch(API+"/api/demo-requests/status/"+encodeURIComponent(cur.handle));
    if(!r.ok)return;
    const s=await r.json();
    const st=$("#st3"), stat=$("#stat");
    if(s.status==="running"&&st)st.textContent="building…";
    if(s.status==="done"&&s.publishedUrl){cur.demo=s.publishedUrl;
      if(stat){stat.className="status-line";stat.textContent="✅ live: "+s.publishedUrl;}
      if(st)st.textContent="live";}
    if(s.status==="failed"&&stat){stat.className="status-line err";stat.textContent="✗ "+(s.error||"build failed");}
  }catch(e){}
}
function openNew(){
  const h=prompt("Instagram handle (no @):");
  if(!h)return;
  cur={business:"@"+h,city:"",handle:h.replace(/^@/,""),pins:[],demo:null,vertical:null};
  DATA.push(cur);
  $("#v-shop").innerHTML=shopHTML(cur);
  show("v-shop");
  $("#back").onclick=()=>{DATA.pop();render();show("v-shelf");};
  $("#build").onclick=()=>build(cur.handle,$("#notes").value);
  $("#build").disabled=false; // new handle: no pins yet, worker researches from scratch
}
boot();
setInterval(()=>poll(),30000);
</script>
</body>
</html>
